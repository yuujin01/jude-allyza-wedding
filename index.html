<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f1e5">
  <title>Jude & Allyza — Wedding Invitation</title>
  <meta name="description" content="Jude and Allyza's wedding invitation — December 3, 2026.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="invitation" aria-label="Jude and Allyza wedding invitation">
    <img class="poster" src="assets/invitation-reference.png" alt="Jude and Allyza's watercolor blue and gold wedding invitation with wedding details, attire guide, gift note and RSVP information">

    <!-- Transparent clickable navigation hotspots preserve the exact artwork underneath. -->
    <nav class="hotspots" aria-label="Invitation navigation">
      <a class="hotspot story" href="#story" aria-label="Our story"></a>
      <a class="hotspot details" href="#wedding-details" aria-label="Wedding details"></a>
      <a class="hotspot attire" href="#attire-guide" aria-label="Attire guide"></a>
      <a class="hotspot gift" href="#gift-guide" aria-label="Gift guide"></a>
      <a class="hotspot nav-rsvp" href="#rsvp" aria-label="RSVP"></a>
      <button class="hotspot heart" id="heart" type="button" aria-label="Save this invitation" aria-pressed="false"></button>
      <a class="hotspot open" href="#story" aria-label="Open invitation"></a>
      <a class="hotspot map" href="https://www.google.com/maps/search/?api=1&query=Municipal+Court+Dinalupihan+Bataan" target="_blank" rel="noopener" aria-label="Get directions to Municipal Court"></a>
    </nav>

    <section id="story" class="anchor story-anchor" aria-label="Our story"></section>
    <section id="wedding-details" class="anchor details-anchor" aria-label="Wedding details"></section>
    <section id="attire-guide" class="anchor attire-anchor" aria-label="Attire guide"></section>
    <section id="gift-guide" class="anchor gift-anchor" aria-label="Gift guide"></section>

    <!-- Functional RSVP controls are placed over the printed RSVP area in the reference image. -->
    <form id="rsvp" class="rsvp-overlay" autocomplete="on">
      <label class="sr-only" for="guest-name">Search your name</label>
      <input id="guest-name" name="guestName" type="text" placeholder="Type your name..." required>
      <div class="attendance" role="group" aria-label="Will you be attending?">
        <label><input type="radio" name="attendance" value="Joyfully accepts" required> <span>Joyfully accepts</span></label>
        <label><input type="radio" name="attendance" value="Regretfully declines"> <span>Regretfully declines</span></label>
      </div>
      <button type="submit" class="continue">Continue ♥</button>
      <p id="rsvp-message" class="rsvp-message" role="status" aria-live="polite"></p>
    </form>

    <div class="countdown-overlay" aria-label="Countdown to the wedding">
      <div><strong id="days">—</strong><span>Days</span></div>
      <div><strong id="hours">—</strong><span>Hours</span></div>
      <div><strong id="minutes">—</strong><span>Minutes</span></div>
      <div><strong id="seconds">—</strong><span>Seconds</span></div>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
